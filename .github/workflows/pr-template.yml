name: PR template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Always runs for same-repo and fork PRs. Cheap body-only gate so owner PRs
# that skip the heavy CI workflow still cannot land with Summary/Test plan bodies.

jobs:
  body:
    runs-on: ubuntu-latest
    steps:
      - name: Require repo PR template headings
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "## What Changed",
              "## Why",
              "## UI Changes",
              "## Validation",
              "## Checklist",
            ];
            const forbidden = [
              { re: /^#{1,6}\s*Summary\b/m, label: "## Summary" },
              { re: /^#{1,6}\s*Test\s*plan\b/im, label: "## Test plan" },
              { re: /^#{1,6}\s*Testing\b/im, label: "## Testing" },
            ];

            const errors = [];
            for (const item of forbidden) {
              if (item.re.test(body)) {
                errors.push(`Forbidden heading ${item.label}`);
              }
            }
            for (const heading of required) {
              if (!body.includes(heading)) {
                errors.push(`Missing heading ${heading}`);
              }
            }

            if (errors.length) {
              core.setFailed(
                "PR body must follow .github/pull_request_template.md\\n" +
                  errors.map((e) => `- ${e}`).join("\\n") +
                  "\\nDo not use ## Summary / ## Test plan / ## Testing."
              );
            }
